<div class="page-wrap flex flex-col h-screen">
  <div class="game-host flex-1 min-h-0 w-full relative">
    <div *ngIf="!gameStarted" class="welcome-overlay flex flex-col items-center justify-center h-full w-full text-center px-8 relative overflow-hidden">
      <button (click)="goHome()" class="home-btn" aria-label="Back to menu">
        <i class="fa-solid fa-house"></i>
      </button>

      <!-- Decorative background layers — pure CSS, no image assets needed -->
      <div class="mountain-bg-far" aria-hidden="true"></div>
      <div class="mountain-bg" aria-hidden="true"></div>
      <div class="rain" aria-hidden="true">
        <span></span><span></span><span></span><span></span>
        <span></span><span></span><span></span><span></span>
      </div>
      <div class="embers" aria-hidden="true">
        <span></span><span></span><span></span><span></span><span></span><span></span>
      </div>

      <div class="welcome-content">
        <div class="welcome-icon">🌋</div>
        <h1 class="welcome-title">Lahar Defense</h1>
        <p class="welcome-subtitle">Mount Pinatubo Disaster Response Game</p>
        <p class="welcome-desc">
          Deploy sandbags, dikes, and plan to protect Bacolor, Porac, or Angeles
          from a simulated volcanic mudflow.
        </p>

        <div class="welcome-steps">
          <div class="step"><span class="step-icon">📍</span><span>Choose a municipality</span></div>
          <div class="step"><span class="step-icon">🛡️</span><span>Defend against the lahar</span></div>
        </div>

        <div class="wave-preview" aria-hidden="true">
          <div class="wave-node">
            <span class="wave-dot wave-dot-easy"></span>
            <span class="wave-node-label">Easy</span>
          </div>
          <div class="wave-connector"></div>
          <div class="wave-node">
            <span class="wave-dot wave-dot-medium"></span>
            <span class="wave-node-label">Medium</span>
          </div>
          <div class="wave-connector"></div>
          <div class="wave-node">
            <span class="wave-dot wave-dot-hard"></span>
            <span class="wave-node-label">Hard</span>
          </div>
        </div>
        <p class="wave-preview-caption">Face three escalating storm waves in one run</p>

        <button (click)="startGame()" class="start-btn">
          <span>Tap to Begin</span>
          <span class="btn-arrow">→</span>
        </button>
      </div>
    </div>

    <iframe *ngIf="gameStarted" class="game-frame w-full h-full border-0 block" [src]="gameUrl"></iframe>
  </div>
</div>
